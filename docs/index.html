<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>WG</title>
    <meta name="description" content="Einkaufsliste, Geld, Putzplan und Pinnwand für eure WG." />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#e5e6e2" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="WG" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <script>
      // iPhone home-screen apps keep their own storage. Without a start_url, iOS keeps the current
      // address (with the #wg= code) when someone adds the app to the home screen.
      if (/iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1)) {
        document.querySelector('link[rel=manifest]').href = './manifest-ios.webmanifest';
      }
      var theme = 'light';
      try {
        var t = localStorage.getItem('wgapp:theme');
        if (t === 'dark' || t === 'system') theme = t;
      } catch (e) {}
      document.documentElement.dataset.theme = theme;
    </script>
    <link rel="icon" href="./icons/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <link rel="preload" href="./assets/fonts/shantell-sans-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="./assets/fonts/atkinson-hyperlegible-next-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="./assets/app-de0eeae81b.css" />
    <script src="./config.js"></script>
    <script type="module" src="./assets/main-3PO3C42A.js"></script>
  </head>

    <noscript>Für die WG-App muss JavaScript eingeschaltet sein.</noscript>
  </body>
</html>
